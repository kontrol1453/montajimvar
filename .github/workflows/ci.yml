name: CI Quality Gate

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    name: Lint + Typecheck + Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-placeholder-secret-not-production
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Bundle size
        if: env.ANALYZE == 'true'
        run: ANALYZE=true npm run build

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    if: always() && needs.quality.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit -- --reporter=verbose
        continue-on-error: true
      - name: Coverage
        run: npm run test:coverage
        continue-on-error: true

  preview-deploy:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Generate preview URL
        run: |
          echo "Preview URL: https://preview-${{ github.head_ref }}.test.montajimvar.xyz"
          echo "(manual deploy via deploy-local.bat with feature branch commit)"
