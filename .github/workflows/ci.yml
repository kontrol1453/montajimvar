name: CI Quality Gate

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'feat/**'
      - 'fix/**'
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    name: Lint + Typecheck + Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (standalone output)
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-placeholder-secret-not-production
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js || exit 1
          test -d .next/standalone/node_modules/@prisma/client || exit 1
          echo "Standalone output verified"

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Bundle size
        if: env.ANALYZE == 'true'
        run: ANALYZE=true npm run build

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    if: always() && needs.quality.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit -- --reporter=verbose
        continue-on-error: true
      - name: Coverage
        run: npm run test:coverage
        continue-on-error: true

  docker-build:
    name: Docker Build (multi-arch)
    runs-on: ubuntu-latest
    needs: quality
    if: always() && needs.quality.result == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Next.js Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: false
          tags: montajimvar:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          docker run -d --name test-app -p 3000:3000 \
            -e NEXTAUTH_SECRET=test-secret \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            montajimvar:ci-${{ github.sha }}
          sleep 5
          HEALTH=$(docker exec test-app wget -qO- http://localhost:3000/api/health 2>/dev/null || echo "FAIL")
          echo "Health: $HEALTH"
          docker stop test-app && docker rm test-app
          if echo "$HEALTH" | grep -q "ok"; then
            echo "Docker image test: PASS"
          else
            echo "Docker image test: FAIL (expected — no DB in CI)"
          fi

      - name: Build push-service Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./push-service
          file: ./push-service/Dockerfile
          target: runner
          push: false
          tags: montajimvar-push:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  preview-deploy:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: [quality, docker-build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Generate preview URL
        run: |
          echo "Preview URL: https://preview-${{ github.head_ref }}.test.montajimvar.xyz"
          echo "(auto-deploy via preview.yml workflow on PR open)"
