name: Production Deploy

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build & Push Next.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/kontrol1453/montajimvar:${{ steps.meta.outputs.version }}
            ghcr.io/kontrol1453/montajimvar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build & Push push-service image
        uses: docker/build-push-action@v6
        with:
          context: ./push-service
          file: ./push-service/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/kontrol1453/montajimvar-push:${{ steps.meta.outputs.version }}
            ghcr.io/kontrol1453/montajimvar-push:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production (Pi)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Pi via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/pi/montajimvar
            git fetch --all
            git checkout ${{ github.ref_name }}

            # Install deps
            npm ci --omit=dev

            # Prisma
            npx prisma generate
            npx prisma migrate deploy
            npx prisma db push --skip-generate

            # Build
            npm run build

            # Symlink swap (zero-downtime)
            DEPLOY_DIR="/home/pi/deploy/montajimvar-$(echo ${{ github.ref_name }} | tr '/' '-')"
            mkdir -p "$DEPLOY_DIR"
            rsync -a --delete \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next/cache' \
              . "$DEPLOY_DIR/"
            ln -sfn "$DEPLOY_DIR" /home/pi/montajimvar

            # Reload PM2
            pm2 reload montajimvar --update-env

      - name: Health check
        run: |
          sleep 10
          curl -fsS https://test.montajimvar.xyz/api/health || exit 1

      - name: Smoke test
        run: |
          curl -fsS https://test.montajimvar.xyz/ > /dev/null
          curl -fsS https://test.montajimvar.xyz/api/categories > /dev/null || true
          curl -fsS https://test.montajimvar.xyz/is-ilanlari > /dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
