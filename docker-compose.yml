# Montajım Var - Docker Compose for Local Development
# Usage: docker-compose up -d

services:
  # ============================================
  # PostgreSQL Database (Neon-compatible local)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: montajimvar-postgres
    environment:
      POSTGRES_DB: montajimvar
      POSTGRES_USER: montajimvar_app
      POSTGRES_PASSWORD: montajimvar_dev
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U montajimvar_app -d montajimvar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - montajimvar-network
    restart: unless-stopped

  # ============================================
  # Main Application (Next.js 16)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: montajimvar-app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://montajimvar_app:montajimvar_dev@postgres:5432/montajimvar?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-secret-change-in-production}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-Montajım Var <noreply@montajimvar.app>}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@montajimvar.app}
      SENTRY_DSN: ${SENTRY_DSN}
      PUSH_SERVICE_URL: http://push-service:3001
      PUSH_SERVICE_KEY: ${PUSH_SERVICE_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./prisma:/app/prisma:ro
      - ./package.json:/app/package.json:ro
      - ./next.config.js:/app/next.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./postcss.config.mjs:/app/postcss.config.mjs:ro
    depends_on:
      postgres:
        condition: service_healthy
      push-service:
        condition: service_healthy
    networks:
      - montajimvar-network
    restart: unless-stopped
    # Development: hot reload via file watching
    command: >
      sh -c "npx prisma generate &&
             npx prisma db push &&
             npm run dev"

  # ============================================
  # Push Notification Service (Express + better-sqlite3)
  # ============================================
  push-service:
    build:
      context: ./push-service
      dockerfile: Dockerfile
      target: runner
    container_name: montajimvar-push
    environment:
      NODE_ENV: development
      PORT: 3001
      VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@montajimvar.app}
      CORS_ORIGIN: http://localhost:3000
      PUSH_SERVICE_KEY: ${PUSH_SERVICE_KEY:-local-dev-push-key}
    ports:
      - "3001:3001"
    volumes:
      - push_data:/app/data
      - ./push-service/server.js:/app/server.js:ro
      - ./push-service/db.js:/app/db.js:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - montajimvar-network
    restart: unless-stopped

  # ============================================
  # pgAdmin (Database Management UI)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: montajimvar-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@montajimvar.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - montajimvar-network
    profiles:
      - tools
    restart: unless-stopped

volumes:
  postgres_data:
  push_data:
  pgadmin_data:

networks:
  montajimvar-network:
    driver: bridge